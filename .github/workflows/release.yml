# Every push to main runs the unit tests, builds a signed release APK and publishes it
# as a new GitHub Release. The newest APK is always at
#   https://github.com/<owner>/<repo>/releases/latest/download/FullerScope.apk
name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # No setup-android step: GitHub's Ubuntu runners ship the Android SDK with
      # ANDROID_HOME set, and setup-android@v3 now fails asking for the removed
      # 'tools' package.

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Decode signing key
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk FullerScope.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${VERSION_CODE}" FullerScope.apk \
            --title "FullerScope 1.0.${VERSION_CODE}" \
            --notes "Automatic build of ${GITHUB_SHA::7}: $(git log -1 --pretty=%s)" \
            --latest
